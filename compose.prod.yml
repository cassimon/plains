# Production overrides: bind service ports to localhost for nginx to proxy.
#
# Deploy command:
#   docker compose -f compose.yml -f compose.prod.yml up -d
#
# External nginx config (add to your server block for domain.com):
#
#   # Backend API  — strip /plains/api, forward /api to backend
#   location /plains/api/ {
#       proxy_pass         http://127.0.0.1:8000/api/;
#       proxy_http_version 1.1;
#       proxy_set_header   Host              $host;
#       proxy_set_header   X-Real-IP         $remote_addr;
#       proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header   X-Forwarded-Proto $scheme;
#   }
#
#   # Adminer — strip /plains/adminer, forward / to adminer
#   location /plains/adminer/ {
#       proxy_pass         http://127.0.0.1:9001/;
#       proxy_http_version 1.1;
#       proxy_set_header   Host              $host;
#       proxy_set_header   X-Real-IP         $remote_addr;
#       proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header   X-Forwarded-Proto $scheme;
#   }
#
#   # Frontend SPA — strip /plains, forward / to frontend (catch-all, must be last)
#   location /plains/ {
#       proxy_pass         http://127.0.0.1:9000/;
#       proxy_http_version 1.1;
#       proxy_set_header   Host              $host;
#       proxy_set_header   X-Real-IP         $remote_addr;
#       proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header   X-Forwarded-Proto $scheme;
#   }
#
# Set in production .env:
#   DOMAIN=domain.com
#   ENVIRONMENT=production
#   FRONTEND_HOST=https://domain.com
#   BACKEND_CORS_ORIGINS=https://domain.com
#   ROOT_PATH=/plains

services:
  # `prestart` is the service that builds the shared backend image
  # (${DOCKER_IMAGE_BACKEND}); `backend` reuses the same tag. Building here with
  # RUN_AS_USER=appuser makes the production image run as a non-root user. The
  # dev stack builds without this arg, so it stays root (bind-mounted source
  # under /app/backend must remain writable for hot-reload).
  prestart:
    build:
      args:
        RUN_AS_USER: appuser

  backend:
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    # Build the non-root nginx stage (UID 101, listens on 8080). The container
    # side of the mapping is 8080 to match; host 9000 is unchanged, so the
    # external-nginx sample (proxy_pass http://127.0.0.1:9000) needs no edit.
    build:
      target: runtime-unprivileged
    ports:
      - "127.0.0.1:9000:8080"

  adminer:
    ports:
      - "127.0.0.1:9001:8080"
