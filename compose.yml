services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-adminer-strip.stripprefix.prefixes=/plains/adminer
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer.rule=Host(`${DOMAIN?Variable not set}`) && PathPrefix(`/plains/adminer`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer.middlewares=${STACK_NAME?Variable not set}-adminer-strip

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - ROOT_PATH=${ROOT_PATH:-}

    volumes:
      # Durable stash for failed / not-yet-succeeded NOMAD upload archives.
      # Survives container recreation so the one-week retention actually holds.
      - nomad-stash:/var/lib/plains/nomad_stash

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.middlewares.${STACK_NAME?Variable not set}-plains-strip.stripprefix.prefixes=/plains
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend.rule=Host(`${DOMAIN?Variable not set}`) && PathPrefix(`/plains/api`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend.middlewares=${STACK_NAME?Variable not set}-plains-strip

  # chatbot: (disabled — re-enable by uncommenting this block and the depends_on in frontend)
  #   image: '${DOCKER_IMAGE_CHATBOT:-plains-chatbot}:${TAG-latest}'
  #   restart: always
  #   networks:
  #     - traefik-public
  #     - default
  #   build:
  #     context: .
  #     dockerfile: frontend/Dockerfile.chatbot
  #   environment:
  #     - PORT=5005
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://localhost:5005/health"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 3
  #   labels:
  #     - traefik.enable=true
  #     - traefik.docker.network=traefik-public
  #     - traefik.constraint-label=traefik-public
  #     - traefik.http.services.${STACK_NAME?Variable not set}-chatbot.loadbalancer.server.port=5005
  #     - traefik.http.routers.${STACK_NAME?Variable not set}-chatbot.rule=Host(`${DOMAIN?Variable not set}`) && PathPrefix(`/plains/chatbot`)
  #     - traefik.http.routers.${STACK_NAME?Variable not set}-chatbot.entrypoints=http
  #     - traefik.http.middlewares.${STACK_NAME?Variable not set}-chatbot-strip.stripprefix.prefixes=/plains/chatbot
  #     - traefik.http.routers.${STACK_NAME?Variable not set}-chatbot.middlewares=${STACK_NAME?Variable not set}-chatbot-strip

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    # depends_on:  # uncomment when chatbot is re-enabled
    #   - chatbot
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://${DOMAIN?Variable not set}/plains
        - VITE_RASA_SERVER_URL=https://${DOMAIN?Variable not set}/plains/chatbot
        - VITE_BASE_PATH=/plains/
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend.rule=Host(`${DOMAIN?Variable not set}`) && PathPrefix(`/plains`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend.middlewares=${STACK_NAME?Variable not set}-plains-strip
volumes:
  app-db-data:
  nomad-stash:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
