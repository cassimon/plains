# Local-testing reverse proxy — mimics the target server's independent nginx,
# which routes  domain.com/plains/  -> frontend  and  domain.com/plains/api/
# -> backend.  It reaches the prod services by their compose service names over
# the default network, so the services' 127.0.0.1-only host bindings are
# irrelevant here.  Loaded only via compose.localproxy.yml (see that file).
server {
    listen 81;
    server_name localhost;

    # NOMAD staging (POST /plains/api/.../upload/files) sends measurement files;
    # nginx's 1 MB default rejects them with 413 before they reach the backend.
    # Raise it here to match what the server's host nginx must also allow.
    client_max_body_size 512m;

    # API first (more specific): /plains/api/... -> backend /api/...
    # The proxy_pass URI (/api/) replaces the matched /plains/api/ prefix.
    location /plains/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA (catch-all, must be last): the trailing slash on proxy_pass
    # strips /plains/ so the frontend — which serves at root — receives
    # /assets/...  The prod frontend is the non-root nginx stage on :8080.
    location /plains/ {
        proxy_pass http://frontend:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
