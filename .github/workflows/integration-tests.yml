name: Integration Tests

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deterministic superuser credentials shared by the stack, the backend
      # integration tests, and the Playwright integration tests. Overrides the
      # .env.example placeholder so every consumer agrees on the password.
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: changethis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Copy env
        run: |
          cp .env.example .env
          # Pin the superuser credentials so the seeded user matches what the
          # tests log in with (the .env.example placeholder is CHANGE_THIS).
          sed -i "s|^FIRST_SUPERUSER=.*|FIRST_SUPERUSER=${FIRST_SUPERUSER}|" .env
          sed -i "s|^FIRST_SUPERUSER_PASSWORD=.*|FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}|" .env

      - name: Build and start stack
        run: |
          docker compose -f compose.yml -f compose.test.yml up -d --build --wait
          docker compose logs prestart

      - name: Run backend integration tests
        run: |
          docker compose exec -T backend \
            bash -c "API_BASE_URL=http://localhost:8000 uv run pytest tests/integration/ -v"

      - name: Install Playwright browsers
        run: cd frontend && bun install && bunx playwright install --with-deps chromium

      - name: Run Playwright integration tests
        env:
          PLAYWRIGHT_INTEGRATION: "true"
          FRONTEND_BASE_URL: http://localhost:5174
          API_BASE_URL: http://localhost:8001
          # FIRST_SUPERUSER / FIRST_SUPERUSER_PASSWORD inherited from job env
        run: cd frontend && bunx playwright test --project=integration --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Tear down stack
        if: always()
        run: docker compose -f compose.yml -f compose.test.yml down -v

  # GUI fuzzing: random walks + the structured create-Experiment-from-Process
  # scenario, run against the Vite dev server with fully mocked API responses.
  # Catches React render/update loops (e.g. "Maximum update depth exceeded")
  # that the API-level integration tests can't see.
  gui-random-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and Playwright browser
        run: cd frontend && bun install && bunx playwright install --with-deps chromium

      - name: Start Vite dev server
        run: |
          cd frontend
          nohup bun run dev > /tmp/vite-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/login > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5173/login > /dev/null

      - name: Run random-walk + structured GUI tests
        env:
          # CI-sized fuzz budget; scale up locally with WALK_COUNT=500 etc.
          WALK_COUNT: "8"
          WALK_STEPS: "50"
          WALK_FOCUSED_REPEATS: "1"
          SPAWN_ROUNDS: "8"
        run: cd frontend && bunx playwright test plains-random-walk --project=chromium --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: random-walk-report
          path: frontend/playwright-report/

      - name: Show dev server log on failure
        if: failure()
        run: tail -100 /tmp/vite-dev.log
