name: Integration Tests

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deterministic superuser credentials shared by the stack, the backend
      # integration tests, and the Playwright integration tests. Overrides the
      # .env.example placeholder so every consumer agrees on the password.
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: changethis

    steps:
      - uses: actions/checkout@v4

      - name: Copy env
        run: |
          cp .env.example .env
          # Pin the superuser credentials so the seeded user matches what the
          # tests log in with (the .env.example placeholder is CHANGE_THIS).
          sed -i "s|^FIRST_SUPERUSER=.*|FIRST_SUPERUSER=${FIRST_SUPERUSER}|" .env
          sed -i "s|^FIRST_SUPERUSER_PASSWORD=.*|FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}|" .env

      - name: Build and start stack
        run: |
          docker compose -f compose.yml -f compose.test.yml up -d --build --wait
          docker compose logs prestart

      - name: Run backend integration tests
        run: |
          docker compose exec -T backend \
            bash -c "API_BASE_URL=http://localhost:8000 uv run pytest tests/integration/ -v"

      - name: Install Playwright browsers
        run: cd frontend && bun install && bunx playwright install --with-deps chromium

      - name: Run Playwright integration tests
        env:
          PLAYWRIGHT_INTEGRATION: "true"
          FRONTEND_BASE_URL: http://localhost:5174
          API_BASE_URL: http://localhost:8001
          # FIRST_SUPERUSER / FIRST_SUPERUSER_PASSWORD inherited from job env
        run: cd frontend && bunx playwright test --project=integration --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Tear down stack
        if: always()
        run: docker compose -f compose.yml -f compose.test.yml down -v
