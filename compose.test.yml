# Integration test overrides — no Traefik, deterministic localhost ports,
# frontend proxies API so VITE_API_URL can be relative (empty = same origin).
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - NOMAD_OAUTH_ENABLED=false
      - NOMAD_MOCK_MODE=true
      - EMAILS_ENABLED=false
      - POSTGRES_SERVER=db
    # The production image only copies ./backend/app, not the tests. Mount the
    # test suite so `pytest tests/integration/` can find it inside the container.
    volumes:
      - ./backend/tests:/app/backend/tests:ro

  frontend:
    ports:
      - "127.0.0.1:5174:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty VITE_API_URL → OpenAPI.BASE="" → relative URLs → nginx proxy below
        - VITE_API_URL=
        - VITE_RASA_SERVER_URL=
        - VITE_BASE_PATH=/
        # Enable the JWT test-auth bypass so Playwright can authenticate without
        # a live Keycloak server (this image is only used for integration tests).
        - VITE_ENABLE_TEST_AUTH=true
    # Mount the proxy config over the default "404 /api" config
    volumes:
      - ./frontend/nginx-test-proxy.conf:/etc/nginx/extra-conf.d/backend-not-found.conf:ro

networks:
  traefik-public:
    # Override external: true so we create it locally for tests
    external: false
